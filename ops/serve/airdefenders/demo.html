<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Defenders — Fabric Demo (8 bots)</title>
<style>
  :root {
    --bg: #07101a; --panel: #0c1a28; --edge: #16344d;
    --ink: #cfe6ff; --dim: #6f93b3; --accent: #38d39f; --warn: #e0b24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }

  /* ── Top bar ───────────────────────────────────────────── */
  header {
    flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--edge);
    padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  }
  header .brand { font-weight: 700; letter-spacing: 0.5px; color: var(--ink); white-space: nowrap; }
  header .brand .tag { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; white-space: nowrap; }
  header .spacer { flex: 1 1 auto; }

  .watch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cmd {
    display: inline-flex; align-items: center; gap: 8px; background: #06223a;
    border: 1px solid var(--edge); border-radius: 6px; padding: 4px 8px; max-width: 100%;
  }
  .cmd code { color: var(--accent); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .cmd button, .surface {
    background: #0e2940; color: var(--ink); border: 1px solid var(--edge);
    border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
    text-decoration: none; white-space: nowrap;
  }
  .cmd button:hover, .surface:hover { background: #14385a; border-color: var(--accent); }
  .surface.primary { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .surfaces { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Grid of game frames ───────────────────────────────── */
  .grid {
    flex: 1 1 auto; display: grid; gap: 2px; padding: 2px; min-height: 0;
    grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr);
    background: var(--edge);
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, 1fr); } }
  @media (max-width: 620px)  { .grid { grid-template-columns: 1fr;
    grid-template-rows: repeat(8, minmax(220px, 1fr)); } }

  .cell { position: relative; background: var(--bg); overflow: hidden; min-height: 0; }
  .cell iframe { width: 100%; height: 100%; border: 0; display: block; }
  .cell .label {
    position: absolute; top: 4px; left: 4px; z-index: 2; pointer-events: none;
    background: rgba(6, 16, 26, 0.78); color: var(--accent); border: 1px solid var(--edge);
    border-radius: 4px; padding: 1px 6px; font-size: 11px; letter-spacing: 0.5px;
  }
  .toast {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #052; padding: 6px 14px; border-radius: 6px;
    font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.2s; z-index: 99;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <span class="brand">AIR DEFENDERS <span class="tag">· fabric demo</span></span>
  <span class="sub" id="siteLabel"></span>
  <span class="spacer"></span>
  <div class="watch">
    <span class="sub">watch the fabric:</span>
    <div class="cmd" title="Copy the goat CLI tail command">
      <code id="subCmd">goat sub --literal 'airdefenders/__SITE_ID__/**' --follow</code>
      <button id="copyBtn" type="button">copy</button>
    </div>
    <div class="surfaces" id="surfaces"></div>
  </div>
</header>

<main class="grid" id="grid"></main>
<div class="toast" id="toast">copied</div>

<script>
// Air Defenders — one-page fabric demo. Renders the eight auto-pilot bot
// personae as independent same-origin iframes (one /mp?bot=<persona> each), so
// the whole co-op room (maxPlayers=8) fills from a single browser tab and you
// watch the resulting events flow over the Zenoh fabric.
//
// SITE_ID is substituted server-side (handleDemoPage). The watch-surface
// hostnames (flashlight / panoscope / stethoscope) are derived from this page's
// own host by swapping the leading "airdefenders" label, so the links are
// correct on any goatnet without per-site config. On localhost the surface
// links won't resolve — that's fine, the eight game frames still run.

// Order matches the personae table in docs/design/airdefenders-multiplayer.md
// and the ALL_BOTS list in spawn-bots.sh.
const PERSONAS = ['trigger','deadeye','gremlin','dozer','sloppy','squint','nomad','camel'];
const SITE_ID = '__SITE_ID__';

// ── Build the 8-cell grid ────────────────────────────────────
const grid = document.getElementById('grid');
for (const bot of PERSONAS) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = bot;
  const frame = document.createElement('iframe');
  frame.src = '/mp?bot=' + encodeURIComponent(bot);
  frame.title = 'Air Defenders bot: ' + bot;
  frame.loading = 'eager';
  frame.allow = 'autoplay';
  cell.appendChild(label);
  cell.appendChild(frame);
  grid.appendChild(cell);
}

// ── Site label + copy button ─────────────────────────────────
document.getElementById('siteLabel').textContent = 'site_id=' + SITE_ID + ' · 8 bots fill the room · close this tab to stop';
// Behind the authenticated door the server knows who opened the demo; show it,
// so a screen-shared demo says who is driving. Silent on a doorless run.
fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(v => { if (v && v.user) document.getElementById('siteLabel').textContent += ' · run by ' + v.user; })
  .catch(() => {});

const toast = document.getElementById('toast');
function flash(msg) {
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1100);
}
document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = document.getElementById('subCmd').textContent;
  try { await navigator.clipboard.writeText(text); flash('copied'); }
  catch (_) {
    // Fallback for non-secure contexts where the Clipboard API is unavailable.
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flash('copied'); } catch (e) { flash('copy failed'); }
    document.body.removeChild(ta);
  }
});

// ── Watch-surface links, derived from this page's hostname ───
const surfaces = document.getElementById('surfaces');
const host = window.location.host;            // e.g. airdefenders.<site>.<zone>
const proto = window.location.protocol;
const focus = encodeURIComponent('airdefenders/' + SITE_ID + '/**');
const SURFACES = [
  // key=, not vendor=: on a slot-pool goatnet the publisher carries no vendor tag and ?vendor= selects nothing ; a topic key resolves to its publisher.
  { name: 'panoscope',  q: '?key=' + encodeURIComponent('airdefenders/' + SITE_ID + '/missile/fired/v1'), hint: 'whole-fabric picture, the airdefenders publisher pre-selected with its live stream', label: 'panoscope · publisher selected', primary: true },
  { name: 'flashlight', q: '?key=' + focus,           hint: 'focused live tail of airdefenders/' + SITE_ID + '/**', label: 'flashlight' },
  { name: 'stethoscope',q: '?topic=' + focus,         hint: 'per-target publish freshness + schema verdict', label: 'stethoscope' },
];
// Only render surface links when this page is served from a real
// "airdefenders.<...>" mesh host — on localhost there are no sibling surfaces.
if (/^airdefenders\./.test(host)) {
  for (const s of SURFACES) {
    const a = document.createElement('a');
    a.className = 'surface';
    a.href = proto + '//' + host.replace(/^airdefenders\./, s.name + '.') + '/' + s.q;
    // Named targets: the title-screen button opens panoscope under the same
    // name, so this link focuses that tab rather than opening a second one.
    a.target = s.name === 'panoscope' ? 'airdefenders-fabric-panoscope' : '_blank';
    a.rel = 'noopener';
    a.textContent = s.label;
    a.title = s.hint;
    if (s.primary) a.classList.add('primary');
    surfaces.appendChild(a);
  }
}
</script>
</body>
</html>
