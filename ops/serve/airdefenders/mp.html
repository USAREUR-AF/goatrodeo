    const cx = GAME_W / 2 - 180;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#00aa66';
    ctx.font = '13px "Courier New", monospace';
    if (isTouchDevice) {
      ctx.fillText('TAP BAR      launch from your station', cx, 470);
      ctx.fillText('TOUCH+DRAG   steer your active interceptor', cx, 488);
      ctx.fillStyle = '#00cc66';
      ctx.fillText('HOLD ARROWS  move your launch station', cx, 506);
      ctx.fillStyle = '#00aaff';
      ctx.fillText('Buttons below: MOVE / MODE / RESUPPLY / FIRE / ADVANCE', cx, 524);
      ctx.fillStyle = '#00aa66';
      ctx.fillText('Edit your name above before the game starts', cx, 542);
    } else {
      ctx.fillText('SPACE        launch from your station', cx, 470);
      ctx.fillText('←↑→↓        steer your active interceptor', cx, 488);
      ctx.fillText('A / D        move your launcher', cx, 506);
      ctx.fillText('TAB          cycle fire mode (your launcher)', cx, 524);
      ctx.fillText('R            resupply your interceptors (2s)', cx, 542);
    }
    ctx.font = '11px "Courier New", monospace';
    ctx.fillStyle = '#006633';
    ctx.fillText('Unarmed = direct hit (instant) · Armed = proximity (1 s) · Autopilot = seek (2 s)', GAME_W / 2 - 250, 568);
    // Fabric demo trigger — platform admins only, and never inside a bot frame
    // (the /demo grid embeds eight of these; the button there would be noise).
    if (!_botParam) drawDemoButton(BTN_DEMO);
    ctx.textAlign = 'left';
  }
  if (phase === 'EMPLACEMENT') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00cc66';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText(`WAVE ${MP.snapCurr.wave || 0} — EMPLACEMENT`, GAME_W / 2, 40);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#009944';
    ctx.fillText('Drag radars to position them. SPACE when ready (any player).', GAME_W / 2, 70);
    ctx.textAlign = 'left';
  }
  if (phase === 'WAVE_END') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.fillText(`WAVE ${MP.snapCurr.wave || 0} COMPLETE`, GAME_W / 2, 220);
    ctx.font = '16px "Courier New", monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('PRESS SPACE for next wave (any player)', GAME_W / 2, 270);
    ctx.textAlign = 'left';
  }
  if (phase === 'CELEBRATION') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 36px "Courier New", monospace';
    ctx.fillText('TOP FIVE!', GAME_W / 2, 200);
    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${MP.snapCurr.score || 0}`, GAME_W / 2, 245);
    ctx.textAlign = 'left';
  }
  if (phase === 'GAME_OVER') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.fillText('AREA COMPROMISED', GAME_W / 2, 90);
    ctx.font = '15px "Courier New", monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(`FINAL SCORE: ${MP.snapCurr.score || 0}   WAVE: ${MP.snapCurr.wave || 0}`, GAME_W / 2, 118);
    if (MP.lastGameOver && MP.lastGameOver.ranks) {
      ctx.font = '13px "Courier New", monospace';
      for (let k = 0; k < MP.lastGameOver.ranks.length; k++) {
        const r = MP.lastGameOver.ranks[k];
        ctx.fillStyle = MP.ownerColor(r.player_id);
        ctx.fillText(`#${r.rank} ${r.name}   intercepts:${r.intercepts}  shots:${r.shots}`, GAME_W / 2, 180 + k * 20);
      }
    }
    // Server auto-derives the team string from the contributor list and
    // persists the row at game-over time — no user input required. The
    // entry will show up on the TITLE leaderboard once SPACE returns home.
    ctx.fillStyle = '#888';
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('Score saved to the multiplayer leaderboard.', GAME_W / 2, 360);
    // Restart prompt — first SPACE returns to TITLE (home); second SPACE
    // there starts a fresh round.
    ctx.fillStyle = '#44aaff';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText('[ PRESS SPACE TO RETURN HOME ]', GAME_W / 2, BTN_BACK_FROM_OVER.y + 28);
    ctx.textAlign = 'left';
  }
}

function drawReconnectBanner() {
  if (!MP.reconnecting && MP.snapCurr) return;
  if (!MP.bannerMessage) return;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(GAME_W / 2 - 200, GAME_H / 2 - 30, 400, 60);
  ctx.strokeStyle = '#ffcc00';
  ctx.strokeRect(GAME_W / 2 - 200, GAME_H / 2 - 30, 400, 60);
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(MP.bannerMessage, GAME_W / 2, GAME_H / 2 + 6);
  ctx.textAlign = 'left';
}

function render() {
  // 60 fps poll + paint
  pollHeldKeys();
  if (BOT.active) BOT.tick();
  // Advance the sweep-radar angle each frame (matches single-player's 60 fps loop).
  sweepAngle = (sweepAngle + SWEEP_RATE) % (Math.PI * 2);
  ctx.clearRect(0, 0, GAME_W, GAME_H);
  ctx.fillStyle = '#060612';
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  drawStars();
  drawGround();
  if (MP.snapCurr) {
    const s = MP.snapCurr;
    if (s.radars) for (const r of s.radars) drawRadar(r);
    // Sweep radar visible during COMBAT / WAVE_END / GAME_OVER (matches solo).
    if (s.phase === 'COMBAT' || s.phase === 'WAVE_END' || s.phase === 'GAME_OVER') {
      drawSweepRadar();
    }
    if (s.blast_waves) for (const b of s.blast_waves) drawBlastWave(b);
    if (s.shaheds) for (const sh of s.shaheds) {
      const pos = MP.interpPos('shaheds', sh.eid) || sh.pos;
      drawShahed({ ...sh, pos });
    }
    if (s.interceptors) for (const it of s.interceptors) {
      const pos = MP.interpPos('interceptors', it.eid) || it.pos;
      drawInterceptor({ ...it, pos });
    }
    if (s.launchers) for (const L of s.launchers) drawLauncher(L);
    if (s.camels) for (const c of s.camels) drawCamel(c);
    if (s.camel_spits) for (const sp of s.camel_spits) drawCamelSpit(sp);
    if (s.explosions) for (const e of s.explosions) drawExplosion(e);
    // Trajectory review + kill markers at WAVE_END / GAME_OVER, from the cached
    // wave.summary frame. drawAllTrajectories renders every shahed (green/red)
    // and every interceptor (blue/gray) path; drawKillMarkers layers the
    // clickable green-pulse circles on top; a selected kill gets the
    // dim-everything-else freeze-frame overlay.
    if ((s.phase === 'WAVE_END' || s.phase === 'GAME_OVER') && MP.lastWaveSummary) {
      drawAllTrajectories(MP.lastWaveSummary);
      if (MP.lastWaveSummary.kills) drawKillMarkers(MP.lastWaveSummary.kills);
      if (MP.selectedKill !== null && MP.selectedKill !== undefined && MP.lastWaveSummary.kills && MP.lastWaveSummary.kills[MP.selectedKill]) {
        drawKillFreezeFrame(MP.lastWaveSummary.kills[MP.selectedKill]);
      }
    }
    drawBunkerOverlay(s.bunker);
    drawPhaseOverlay();
    drawHUD();
    drawRoster();
  } else {
    ctx.fillStyle = '#888';
    ctx.font = '18px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CONNECTING TO SERVER…', GAME_W / 2, GAME_H / 2);
    ctx.textAlign = 'left';
  }
  drawReconnectBanner();
  requestAnimationFrame(render);
}

// ─── HTML touchControls wiring ──────────────────────────────────────────
// Hold-to-move arrow buttons proxy to heldKeys('KeyA'/'KeyD'), which the
// existing pollHeldKeys() converts into input.launcher_move at 30/sec —
// matches the server's per-player rate cap exactly. No throttling math,
// no slider feedback loop, same feel as keyboard A/D. Fire / mode / resupply
// / advance buttons are click-only.
const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnMode  = document.getElementById('btnMode');
const btnSup   = document.getElementById('btnSup');
const btnFire  = document.getElementById('btnFire');
const btnAdv   = document.getElementById('btnAdv');

// bindHoldButton — wire pointerdown/up/cancel/leave so the button "press"
// state corresponds exactly to whether the user's finger is on it. Adds the
// .held class for visual feedback. Pointer events cover mouse + touch in a
// single code path on every modern browser.
function bindHoldButton(btn, code) {
  const press = (e) => {
    e.preventDefault();
    heldKeys.add(code);
    btn.classList.add('held');
    if (e.pointerId !== undefined && btn.setPointerCapture) {
      try { btn.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    }
  };
  const release = () => {
    heldKeys.delete(code);
    btn.classList.remove('held');
  };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
bindHoldButton(btnLeft,  'KeyA');
bindHoldButton(btnRight, 'KeyD');

btnMode.addEventListener('click', () => {
  const myL = MP.myLauncher();
  if (!myL) return;
  const next = ((myL.fire_mode || 0) + 1) % 3;
  MP.send('input.fire_mode', { launcher_idx: myL.idx, mode: next });
});
btnSup.addEventListener('click', () => {
  const myL = MP.myLauncher();
  if (!myL) return;
  MP.send('input.resupply', { launcher_idx: myL.idx });
});
btnFire.addEventListener('click', () => {
  if (!MP.snapCurr) return;
  if (MP.snapCurr.phase !== 'COMBAT') return;
  const myL = MP.myLauncher();
  if (!myL) return;
  MP.send('input.fire', { launcher_idx: myL.idx });
});
btnAdv.addEventListener('click', () => {
  if (!MP.snapCurr) return;
  // Same logic SPACE uses on a desktop keyboard.
  const phase = MP.snapCurr.phase;
  if (phase === 'TITLE' || phase === 'EMPLACEMENT' || phase === 'WAVE_END' || phase === 'GAME_OVER') {
    MP.send('input.state_advance', {});
  }
});

// updateTouchControls — called once per render frame to keep button labels
// and enable/disable state aligned with the game phase.
function updateTouchControls() {
  if (!isTouchDevice) return;
  if (!MP.snapCurr) {
    btnAdv.textContent = 'CONNECTING…';
    btnAdv.disabled = true;
    btnFire.disabled = true;
    btnMode.disabled = true;
    btnSup.disabled = true;
    btnLeft.disabled = true;
    btnRight.disabled = true;
    return;
  }
  const phase = MP.snapCurr.phase;
  const myL = MP.myLauncher();
  btnFire.disabled = !(phase === 'COMBAT' && !!myL);
  btnMode.disabled = !(phase === 'COMBAT' && !!myL);
  btnSup.disabled  = !(phase === 'COMBAT' && !!myL);
  // Movement buttons usable when we own a launcher; the server validates
  // ownership and rate-limits, but client-side we mirror that for the visual.
  const canMove = !!myL && (phase === 'COMBAT' || phase === 'EMPLACEMENT');
  btnLeft.disabled  = !canMove;
  btnRight.disabled = !canMove;
  // If a state change disables a button mid-hold, clear the held flag so the
  // launcher doesn't coast after a phase transition.
  if (btnLeft.disabled  && heldKeys.has('KeyA')) { heldKeys.delete('KeyA'); btnLeft.classList.remove('held'); }
  if (btnRight.disabled && heldKeys.has('KeyD')) { heldKeys.delete('KeyD'); btnRight.classList.remove('held'); }
  if (phase === 'TITLE')          btnAdv.textContent = 'START';
  else if (phase === 'EMPLACEMENT') btnAdv.textContent = 'READY';
  else if (phase === 'WAVE_END')   btnAdv.textContent = 'NEXT WAVE';
  else if (phase === 'GAME_OVER')  btnAdv.textContent = 'HOME';
  else                              btnAdv.textContent = 'COMBAT';
  btnAdv.disabled = (phase === 'COMBAT');
}

// Hook the per-frame sync into the render loop. We can't insert into render()
// without a bigger refactor, so just piggyback on requestAnimationFrame.
function tickTouchControls() {
  updateTouchControls();
  requestAnimationFrame(tickTouchControls);
}
if (isTouchDevice) requestAnimationFrame(tickTouchControls);

// ============================================================================
// Auto-pilot — persona-driven bot.
//
// A bot reads the same state.tick snapshots a human sees and sends the same
// input verbs (input.fire / input.launcher_move / input.steer / input.fire_mode
// / input.resupply / input.state_advance / input.bunker_run / input.camel_release).
// The server cannot tell a bot from a human. Enable via URL params:
//   /mp?bot=trigger        (bot=<persona> implies auto-play; auto=1 alone → trigger)
// or from devtools: BOT.enable('deadeye').
//
// Each persona is one parameter set over a single heuristic core: pick the most
// threatening live shahed, slide the launcher under its predicted intercept-X,
// fire when lined up and off cooldown. Personae differ only in the knobs below.
// See docs/design/airdefenders-multiplayer.md §"Auto-pilot personae".
// ============================================================================
const PERSONAS = {
  // mode       fire_mode to hold (0 manual / 1 armed-prox / 2 autopilot); null = leave alone
  // fireMs     min ms between fire attempts
  // aimTol     px |targetX-launcherX| within which it fires
  // aimNoise   px random jitter added to the target each decision
  // moveSpeed  0..1 fraction of the ±6 px/tick max launcher step it uses
  // reactionMs ms between decisions (higher = more sluggish)
  // churn      prob/decision of picking a random target instead of the most urgent
  // vis        true = ignore shaheds the radar can't see (visible <= 0.1)
  // resupplyAt reload when interceptors_left <= this
  // steer      true = manually steer the in-flight interceptor toward the target
  // modeFlip   true = randomly cycle fire_mode (chaos)
  // napProb/napMs  chance/decision to "nap" (idle) for napMs
  // roam       true = sweep the launcher across the whole field, spraying
  // useCamel   true = release camels when the pool has them
  // holdCenter true = sit at mid-field when there is no target
  trigger: { label:'Trigger', mode:2,    fireMs:110, aimTol:130, aimNoise:25,  moveSpeed:0.90, reactionMs:90,  churn:0.05, vis:false, resupplyAt:1 },
  deadeye: { label:'Deadeye', mode:0,    fireMs:620, aimTol:13,  aimNoise:2,   moveSpeed:1.00, reactionMs:90,  churn:0.00, vis:false, resupplyAt:2, steer:true },
  gremlin: { label:'Gremlin', mode:null, fireMs:190, aimTol:95,  aimNoise:130, moveSpeed:1.00, reactionMs:120, churn:0.50, vis:false, resupplyAt:0, modeFlip:true },
  dozer:   { label:'Dozer',   mode:1,    fireMs:900, aimTol:60,  aimNoise:30,  moveSpeed:0.35, reactionMs:430, churn:0.10, vis:false, resupplyAt:0, napProb:0.03, napMs:2600 },
  sloppy:  { label:'Sloppy',  mode:2,    fireMs:180, aimTol:75,  aimNoise:75,  moveSpeed:0.70, reactionMs:160, churn:0.35, vis:false, resupplyAt:1 },
  squint:  { label:'Squint',  mode:0,    fireMs:380, aimTol:20,  aimNoise:8,   moveSpeed:0.90, reactionMs:120, churn:0.05, vis:true,  resupplyAt:2, steer:true },
  nomad:   { label:'Nomad',   mode:2,    fireMs:150, aimTol:90,  aimNoise:30,  moveSpeed:1.00, reactionMs:100, churn:0.10, vis:false, resupplyAt:1, roam:true },
  camel:   { label:'Camel',   mode:1,    fireMs:520, aimTol:48,  aimNoise:25,  moveSpeed:0.50, reactionMs:150, churn:0.10, vis:false, resupplyAt:2, useCamel:true, holdCenter:true },
};

const BOT = {
  active: false, persona: null, name: 'bot',
  _lastDecision: 0, _lastFire: 0, _lastMove: 0, _lastSteer: 0,
  _lastMode: 0, _lastResupply: 0, _lastAdvance: 0, _lastCamel: 0,
  _napUntil: 0, _nameSent: false, _targetX: null,

  rnd() { return Math.random(); },

  enable(name) {
    const p = PERSONAS[name];
    if (!p) { console.warn('[bot] unknown persona', name, '— known:', Object.keys(PERSONAS).join(',')); return; }
    this.active = true; this.persona = p; this.name = p.label;
    try { document.title = 'AD bot · ' + p.label; } catch (_) {}
    console.log('[bot] persona enabled:', p.label);
  },

  init() {
    const q = new URLSearchParams(window.location.search);
    const b = (q.get('bot') || '').toLowerCase();
    if (b && PERSONAS[b]) this.enable(b);
    else if (q.get('auto') === '1') this.enable('trigger');
  },

  // Most urgent live shahed = closest to the ground (largest y); optionally
  // restricted to radar-visible ones. Returns a shahed or null.
  pickTarget(snap) {
    const p = this.persona;
    let pool = (snap.shaheds || []).filter(s => s.alive !== false);
    if (p.vis) pool = pool.filter(s => (s.visible == null ? 1 : s.visible) > 0.1);
    if (!pool.length) return null;
    if (this.rnd() < p.churn) return pool[(this.rnd() * pool.length) | 0];
    let best = null;
    for (const s of pool) if (!best || s.pos.y > best.pos.y) best = s;
    return best;
  },

  tick() {
    if (!this.active) return;
    const snap = MP.snapCurr; if (!snap) return;
    const now = performance.now();
    const p = this.persona;

    // Assert our persona name once we have a player id (covers reconnect paths).
    if (!this._nameSent && MP.playerId > 0 && MP.ws && MP.ws.readyState === WebSocket.OPEN) {
      MP.send('input.set_name', { name: this.name });
      this._nameSent = true;
    }

    // Non-combat: keep nudging the state machine so a bot needs zero clicks.
    // WAVE_END only accepts the advance once the server's waveEndTimer>60, so
    // we just retry on a throttle until it takes.
    if (snap.phase !== 'COMBAT') {
      if (now - this._lastAdvance > 400) { MP.send('input.state_advance', {}); this._lastAdvance = now; }
      this._targetX = null;
      return;
    }

    // Survive the bunker mini-game regardless of persona — hit RUN whenever the
    // server offers it, else the run just ends.
    if (snap.bunker && snap.bunker.phase === 'active') MP.send('input.bunker_run', {});

    const myL = MP.myLauncher();
    if (!myL) return;
    if (now < this._napUntil) return;

    // ---- decision (throttled by reactionMs) ----
    if (now - this._lastDecision >= p.reactionMs) {
      this._lastDecision = now;
      if (p.napProb && this.rnd() < p.napProb) { this._napUntil = now + p.napMs; return; }

      // camel release (Camel persona)
      if (p.useCamel && snap.camel_mode && (snap.camel_pool | 0) > 0 && now - this._lastCamel > 1500) {
        MP.send('input.camel_release', {}); this._lastCamel = now;
      }

      // fire-mode: chaos cycles, others hold a preference
      if (p.modeFlip && now - this._lastMode > 700) {
        MP.send('input.fire_mode', { launcher_idx: myL.idx, mode: ((myL.fire_mode || 0) + 1) % 3 });
        this._lastMode = now;
      } else if (p.mode != null && (myL.fire_mode || 0) !== p.mode && now - this._lastMode > 500) {
        MP.send('input.fire_mode', { launcher_idx: myL.idx, mode: p.mode });
        this._lastMode = now;
      }

      // resupply before running dry
      if ((myL.interceptors_left | 0) <= (p.resupplyAt | 0) && !myL.resupplying && now - this._lastResupply > 800) {
        MP.send('input.resupply', { launcher_idx: myL.idx }); this._lastResupply = now;
      }

      // choose an aim-X
      const tgt = this.pickTarget(snap);
      let tx;
      if (p.roam) { tx = GAME_W / 2 + Math.sin(now / 1000 * 0.6) * (GAME_W / 2 - 80); }
      else if (tgt) { tx = tgt.pos.x + (tgt.vel ? tgt.vel.x * 6 : 0); }
      else if (p.holdCenter) { tx = GAME_W / 2; }
      else { tx = myL.x; }
      tx += (this.rnd() * 2 - 1) * p.aimNoise;
      this._targetX = Math.max(40, Math.min(GAME_W - 40, tx));

      // manual steer (precision personas) toward the live target
      if (p.steer && tgt && now - this._lastSteer >= 100) {
        const eid = MP.myActiveInterceptorEid();
        if (eid != null) { MP.send('input.steer', { interceptor_eid: eid, aim: { x: tgt.pos.x, y: tgt.pos.y } }); this._lastSteer = now; }
      }

      // fire when lined up, armed, off cooldown, with ammo to spare
      const lined = Math.abs(this._targetX - myL.x) <= p.aimTol;
      const ready = (myL.interceptors_left | 0) > 0 && !myL.arming && !myL.resupplying;
      const wantFire = !!tgt || p.roam;
      if (wantFire && lined && ready && now - this._lastFire >= p.fireMs) {
        MP.send('input.fire', { launcher_idx: myL.idx }); this._lastFire = now;
      }
    }

    // ---- movement (every frame, ~30 Hz throttle) toward the cached aim-X ----
    if (this._targetX != null && now - this._lastMove >= 33) {
      const delta = this._targetX - myL.x;
      if (Math.abs(delta) > 2) {
        const dx = Math.max(-6, Math.min(6, delta)) * p.moveSpeed;
        if (Math.abs(dx) > 0.2) { MP.send('input.launcher_move', { launcher_idx: myL.idx, dx }); this._lastMove = now; }
      }
    }
  },
};
window.BOT = BOT;
BOT.init();

// Boot.
const savedName = (BOT.active ? BOT.name : null)
  || localStorage.getItem('airdefenders_name') || ssGet('mp_name') || '';
if (savedName) ssSet('mp_name', savedName);
MP.connect();
requestAnimationFrame(render);
</script>
</body>
