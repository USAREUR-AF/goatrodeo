<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Air Defenders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #0a0a1a; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
body { display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
#frame { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
canvas { display: block; touch-action: none; }
#touchControls { display: none; width: 100%; max-width: 800px; padding: 8px; flex-direction: column; gap: 8px; }
#touchControls.touch { display: flex; }
#touchControls .row { display: flex; gap: 8px; }
#touchControls .row > * { flex: 1; }
#touchControls button { min-height: 56px; font-family: 'Courier New', monospace; font-weight: bold; font-size: 14px; color: #cce; background: #1a1a2a; border: 2px solid #444; border-radius: 6px; padding: 8px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#touchControls button.fire { background: #2a0a0a; border-color: #ff6644; color: #ffcc66; min-height: 68px; font-size: 18px; flex: 2; }
#touchControls button.adv  { background: #0a1a2a; border-color: #44aaff; color: #aaddff; }
#touchControls button.mode { border-color: #ffcc00; color: #ffcc00; }
#touchControls button.sup  { border-color: #00aaff; color: #00aaff; }
#touchControls button.sw   { border-color: #88ccff; color: #88ccff; }
#touchControls button.dir  { background: #0a2a1a; border-color: #00cc66; color: #aaffcc; font-size: 22px; min-height: 64px; flex: 1; }
#touchControls button.dir.held { background: #1a4a2a; filter: brightness(1.4); }
#touchControls button:active { transform: scale(0.97); filter: brightness(1.3); }
#touchControls button[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game"></canvas>
  <div id="touchControls">
    <div class="row">
      <button id="btnLeft"  class="dir" type="button" aria-label="Move launcher left">&#9664; MOVE</button>
      <button id="btnRight" class="dir" type="button" aria-label="Move launcher right">MOVE &#9654;</button>
    </div>
    <div class="row">
      <button id="btnMode" class="mode" type="button">MODE</button>
      <button id="btnSup"  class="sup"  type="button">RESUPPLY</button>
      <button id="btnSwitch" class="sw" type="button" hidden>SWITCH</button>
    </div>
    <div class="row">
      <button id="btnFire" class="fire" type="button">FIRE</button>
      <button id="btnAdv"  class="adv"  type="button">START</button>
    </div>
  </div>
</div>
<input id="nameInput" type="text" maxlength="14" autocomplete="off" spellcheck="false"
       style="position:absolute; display:none; font-family:'Courier New',monospace;
              font-size:18px; background:#0a1a0a; color:#00ff88; border:2px solid #00aa66;
              border-radius:4px; text-align:center; padding:8px 12px; width:240px;
              outline:none; z-index:10;">
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- RESPONSIVE SIZING ---
// Internal resolution stays 800x700, canvas element scales to fill screen
const GAME_W = 800;
const GAME_H = 700;
canvas.width = GAME_W;
canvas.height = GAME_H;

const touchControls = document.getElementById('touchControls');
function resizeCanvas() {
  const vv = window.visualViewport;
  const w = vv ? vv.width : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  // Reserve room for the HTML touch-controls strip when it's visible.
  const stripH = (touchControls && touchControls.classList.contains('touch')) ? (touchControls.offsetHeight || 0) : 0;
  const availH = Math.max(200, h - stripH);
  const margin = Math.min(w, availH) < 500 ? 1.0 : 0.98;
  const scale = Math.min(w / GAME_W, availH / GAME_H) * margin;
  canvas.style.width = (GAME_W * scale) + 'px';
  canvas.style.height = (GAME_H * scale) + 'px';
}
// Defer first sizing one frame so the touchControls strip's offsetHeight
// reflects the .touch class addition (set below once isTouchDevice resolves).
requestAnimationFrame(resizeCanvas);
window.addEventListener('resize', resizeCanvas);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

// --- TOUCH SUPPORT ---
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouchDevice) touchControls.classList.add('touch');
let touchSteerForce = 0;
let touchSteerActive = false;
let touchX = 0;
let touchY = 0;

// Virtual button zones (defined in canvas coordinates)
const BTN = {
  mode: { x: 15, y: GAME_H - 115, w: 200, h: 40 },
  resupply: { x: GAME_W - 215, y: GAME_H - 115, w: 200, h: 40 },
  switchLauncher: { x: GAME_W / 2 - 75, y: GAME_H - 115, w: 150, h: 40 },
};
// Title-screen-only button that navigates to the co-op multiplayer page.
const BTN_MP_LINK = { x: GAME_W / 2 - 130, y: 590, w: 260, h: 44 };
// TITLE-screen EDIT NAME button — small canvas hit-rect above the controls
// block. Tap pops the nameInput overlay; commit on Enter / blur persists to
// localStorage so both SP + MP pick up the new name.
const BTN_EDIT_NAME = { x: GAME_W / 2 - 130, y: 420, w: 260, h: 36 };
// TITLE-screen DEMO button — admins only (see ME below). Top-right corner,
// clear of the leaderboard, the controls block and the ground strip.
const BTN_DEMO = { x: GAME_W - 275, y: 14, w: 260, h: 32 };

// ── Who is looking? (DEMO button) ─────────────────────────────────────────
// GET /api/me says whether the viewer may run the fabric demo. Behind the
// authenticated door the server reads the proxy's X-Forwarded-Groups; with no
// door it answers demo_admin=false for everyone (fail closed). The button is
// drawn and hit-tested only when demo_admin is true, so ordinary players never
// see it. A network error or 401 (no session yet) means "not an admin".
const ME = { demo_admin: false, user: '' };
fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(v => { if (v) { ME.demo_admin = !!v.demo_admin; ME.user = v.user || ''; } })
  .catch(() => {});
// One click: the /demo page opens in its own tab (named, so a second click
// focuses the same tab instead of starting a second fleet) and the eight bots
// fill the room and start publishing. Close that tab to stop the demo.
// On a goatnet (host airdefenders.<site>.<zone>) the same click also opens
// panoscope with the airdefenders publisher pre-selected. The Block 94 `key=`
// form is used, not `vendor=`: on a slot-pool goatnet the publisher node
// carries no vendor tag, so `?vendor=airdefenders` selects nothing,
// while `?key=<topic>` resolves to the topic's publisher and
// opens its side panel with the live stream.
// The demo tab's top bar carries the same panoscope link for the case where
// the browser's popup rule lets only one window through per click.
// <site> from airdefenders.<site>.<zone>; the label after the leading one.
const PANOSCOPE_SITE = (window.location.host.split('.')[1] || '');
function openFabricDemo() {
  const host = window.location.host;
  if (/^airdefenders\./.test(host)) {
    window.open(window.location.protocol + '//' + host.replace(/^airdefenders\./, 'panoscope.') + '/?key=' + encodeURIComponent('airdefenders/' + PANOSCOPE_SITE + '/missile/fired/v1'),
                'airdefenders-fabric-panoscope');
  }
  window.open('/demo', 'airdefenders-fabric-demo');
}
function drawDemoButton(btn) {
  if (!ME.demo_admin) return;
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
  ctx.strokeStyle = '#ffaa33';
  ctx.lineWidth = 2;
  ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
  ctx.fillStyle = '#ffaa33';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('\u25B6 RUN FABRIC DEMO  (admin)', btn.x + btn.w / 2, btn.y + 21);
  ctx.lineWidth = 1;
}

function touchToCanvas(touch) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (touch.clientX - r.left) * (GAME_W / r.width),
    y: (touch.clientY - r.top) * (GAME_H / r.height)
  };
}

function inBtn(pt, btn) {
  return pt.x >= btn.x && pt.x <= btn.x + btn.w && pt.y >= btn.y && pt.y <= btn.y + btn.h;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const pt = touchToCanvas(e.changedTouches[i]);

    // TITLE — taps may navigate to MP page or open the name editor; state
    // advance is SPACE-only.
    if (state === TITLE) {
      if (inBtn(pt, BTN_EDIT_NAME)) { openNameEditorOnTitle(); continue; }
      if (inBtn(pt, BTN_MP_LINK)) { window.location.href = '/mp'; return; }
      if (ME.demo_admin && inBtn(pt, BTN_DEMO)) { openFabricDemo(); return; }
      continue;
    }
    // Kill point tap detection (wave end + game over). State advance happens
    // on SPACE only — taps select / dismiss freeze frames or change period.
    if ((state === WAVE_END || state === GAME_OVER) && killSnapshots.length > 0) {
      if (selectedSnapshot !== null) { selectedSnapshot = null; continue; }
      let hitKill = false;
      for (let ki = 0; ki < killSnapshots.length; ki++) {
        if (Math.hypot(pt.x - killSnapshots[ki].x, pt.y - killSnapshots[ki].y) < 24) {
          selectedSnapshot = ki;
          hitKill = true;
          break;
        }
      }
      if (hitKill) continue;
    }
    if (state === GAME_OVER) {
      if (enteringName) continue; // don't restart while entering name
      if (lbTapZone && pt.x >= lbTapZone.x1 && pt.x <= lbTapZone.x2 && pt.y >= lbTapZone.y1 && pt.y <= lbTapZone.y2) {
        leaderboardPeriod = (leaderboardPeriod + 1) % 5;
        refreshServerScores(leaderboardPeriod, true);
        continue;
      }
      // Restart is SPACE-only (no tap-to-restart).
      continue;
    }

    // Emplacement — drag radars. State advance to COMBAT is SPACE-only.
    if (state === EMPLACEMENT) {
      for (let ri = radars.length - 1; ri >= 0; ri--) {
        const d = Math.hypot(pt.x - radars[ri].x, pt.y - radars[ri].y);
        if (d < 30) { draggedRadar = ri; break; }
      }
      continue;
    }

    // Combat
    if (state === COMBAT) {
      // Bunker RUN button — highest priority during warning
      if (bunkerPhase === 'active' && bunkerRunTimer === 0 && inBtn(pt, BTN_BUNKER_RUN)) {
        startBunkerRun();
        continue;
      }
      // Camel release button
      if (camelMode && camelPool > 0 && inBtn(pt, BTN_CAMEL)) {
        releaseCamel();
        continue;
      }
      // Mode button
      if (inBtn(pt, BTN.mode)) {
        const L = launchers[activeLauncher];
        L.fireMode = (L.fireMode + 1) % 3;
        if (L.fireMode === 0) { L.arming = false; L.armTimer = 0; }
        continue;
      }
      // Resupply button
      if (inBtn(pt, BTN.resupply)) {
        triggerResupply(activeLauncher);
        continue;
      }
      // Switch launcher button
      if (launchers.length > 1 && inBtn(pt, BTN.switchLauncher)) {
        activeLauncher = (activeLauncher + 1) % launchers.length;
        continue;
      }
      // Tap launcher bar = select launcher and fire
      if (pt.y > GAME_H - 55) {
        const li = getLauncherAtX(pt.x);
        fireFromLauncher(li);
        continue;
      }
      // Touch sky = steer
      touchX = pt.x;
      touchY = pt.y;
      touchSteerActive = true;
      continue;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const pt = touchToCanvas(e.changedTouches[i]);

    // Emplacement — drag radar
    if (state === EMPLACEMENT && draggedRadar >= 0) {
      radars[draggedRadar].x = Math.max(40, Math.min(GAME_W - 40, pt.x));
      radars[draggedRadar].y = Math.max(100, Math.min(GAME_H - 120, pt.y));
      continue;
    }

    // Combat — update touch position for interceptor-relative steering
    if (state === COMBAT && touchSteerActive) {
      touchX = pt.x;
      touchY = pt.y;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  draggedRadar = -1;
  touchSteerForce = 0;
  touchSteerActive = false;
}, { passive: false });

canvas.addEventListener('touchcancel', e => {
  draggedRadar = -1;
  touchSteerForce = 0;
  touchSteerActive = false;
});

// --- GAME STATE ---
const TITLE = 0, EMPLACEMENT = 1, COMBAT = 2, WAVE_END = 3, GAME_OVER = 4, CELEBRATION = 5;
let state = TITLE;
let wave = 0;
// Dev preview — URL ?wave=N starts the next new game at wave N
const urlParams = new URLSearchParams(window.location.search);
let cheatStartWave = parseInt(urlParams.get('wave') || '1', 10);
if (!isFinite(cheatStartWave) || cheatStartWave < 1) cheatStartWave = 1;
if (cheatStartWave > 99) cheatStartWave = 99;
wave = cheatStartWave - 1;
let score = 0;
let lives = 5;
let waveTimer = 0;
let waveEndTimer = 0;
let emplacementReady = false;
let killFlash = 0;
let spaceCooldown = 0;
// Bonus-life: player earns +1 life per 2x expected-hits-per-wave intercepts.
// Expected hits = 0.8 * shahedsPerWave, so threshold = ceil(1.6 * (2 + wave*2)).
let intercepts = 0;
let lifeUpFlash = 0;
function lifeUpThreshold() { return Math.ceil(1.6 * (2 + wave * 2)); }
function registerIntercepts(n) {
  intercepts += n;
  while (intercepts >= lifeUpThreshold()) {
    intercepts -= lifeUpThreshold();
    lives++;
    lifeUpFlash = 120;
  }
}
const ARM_TIME = 60;   // frames to arm (1 second)
const AUTOPILOT_ARM_TIME = 120; // frames to arm autopilot (2 seconds)
const PROX_RADIUS = 147; // blast kill radius
const PROX_TRIGGER = PROX_RADIUS / 4; // detonation trigger — explodes when within 1/4 of blast radius
const AUTOPILOT_DETECT_RADIUS = PROX_RADIUS * 2; // auto-seek detection range
const RESUPPLY_TIME = 120; // frames to resupply (2 seconds)

// --- LEADERBOARD ---
// Server-backed (shared across all players via /api/scores).
// localStorage is used as an offline fallback: when the server is unreachable,
// submissions are queued in PENDING_KEY and replayed once the network returns,
// and LEADERBOARD_KEY holds a local mirror for display during island-mode.
const LEADERBOARD_KEY = 'airdefenders_scores'; // offline mirror
const PENDING_KEY = 'airdefenders_pending';    // unsent submissions (retry queue)
const NAME_KEY = 'airdefenders_name';
let leaderboardPeriod = 4; // 0=daily, 1=weekly, 2=monthly, 3=yearly, 4=all-time
const PERIOD_LABELS = ['DAILY', 'WEEKLY', 'MONTHLY', 'YEARLY', 'ALL TIME'];
const PERIOD_API = ['daily', 'weekly', 'monthly', 'yearly', 'all'];
let enteringName = false;
let scoreSaved = false;
const nameInput = document.getElementById('nameInput');

// Server-cached scores, per period. Refreshed on fetch + SSE.
const serverScores = { daily: [], weekly: [], monthly: [], yearly: [], all: [] };
const lastFetch = { daily: 0, weekly: 0, monthly: 0, yearly: 0, all: 0 };
let onlineMode = true;
let sseSource = null;

// Restore last used name
nameInput.value = localStorage.getItem(NAME_KEY) || '';

function loadLocalScores() {
  try { return JSON.parse(localStorage.getItem(LEADERBOARD_KEY)) || []; }
  catch { return []; }
}

function saveLocalScore(entry) {
  const scores = loadLocalScores();
  scores.push(entry);
  scores.sort((a, b) => b.score - a.score);
  if (scores.length > 100) scores.length = 100;
  localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(scores));
}

async function refreshServerScores(period, force) {
  const key = PERIOD_API[period];
  const now = Date.now();
  if (!force && now - lastFetch[key] < 5000) return;
  lastFetch[key] = now;
  try {
    // Single-player explicitly asks for mode=sp so 8-player team scores from
    // MP don't crowd the solo leaderboard.
    const res = await fetch('/api/scores?period=' + key + '&mode=sp', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    serverScores[key] = data.scores || [];
    onlineMode = true;
    flushPending();
  } catch (err) {
    onlineMode = false;
  }
}

async function submitScore(entry) {
  try {
    const res = await fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: entry.name, score: entry.score, wave: entry.wave, mode: 'sp' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    onlineMode = true;
    // Refresh current view so submitter sees their entry immediately.
    refreshServerScores(leaderboardPeriod, true);
    return true;
  } catch (err) {
    const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
    pending.push(entry);
    localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
    onlineMode = false;
    return false;
  }
}

async function flushPending() {
  const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
  if (!pending.length) return;
  const remaining = [];
  for (const entry of pending) {
    try {
      const res = await fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: entry.name, score: entry.score, wave: entry.wave }),
      });
      if (!res.ok) remaining.push(entry);
    } catch {
      remaining.push(entry);
    }
  }
  localStorage.setItem(PENDING_KEY, JSON.stringify(remaining));
}

function saveScore(s, w, name) {
  const n = (name || 'ANON').toUpperCase().substring(0, 14);
  localStorage.setItem(NAME_KEY, n);
  const entry = { score: s, wave: w, date: Date.now(), name: n };
  saveLocalScore(entry);   // offline mirror
  submitScore(entry);      // server submission (queued if offline)
}

function subscribeSSE() {
  if (sseSource) return;
  try {
    sseSource = new EventSource('/api/scores/stream');
    sseSource.addEventListener('score', e => {
      try {
        const s = JSON.parse(e.data);
        // Live push into all-time cache; other periods refresh naturally.
        if (!serverScores.all.some(x => x.id === s.id)) {
          serverScores.all.push(s);
          serverScores.all.sort((a, b) => b.score - a.score);
          if (serverScores.all.length > 10) serverScores.all.length = 10;
        }
        onlineMode = true;
      } catch { /* ignore malformed event */ }
    });
    // EventSource auto-reconnects on error; nothing to do.
  } catch {
    // Browser doesn't support SSE — polling covers it.
  }
}

function showNameInput() {
  enteringName = true;
  scoreSaved = false;
  const r = canvas.getBoundingClientRect();
  const scale = r.width / GAME_W;
  nameInput.style.display = 'block';
  nameInput.style.left = (r.left + r.width / 2 - 110) + 'px';
  nameInput.style.top = (r.top + (GAME_H / 2 + 5) * scale - 18) + 'px';
  nameInput.style.fontSize = Math.max(14, 18 * scale) + 'px';
  nameInput.focus();
  nameInput.select();
}

function hideNameInput() {
  nameInput.style.display = 'none';
  nameInput.blur();
  enteringName = false;
}

// --- END-OF-GAME PHRASES (verbatim, do not edit grammar) ---
const END_PHRASES = [
  'Good Thing Time Take Time!',
  "Retro Vibes, Let's Join Us!",
  'Way Simplicity. Small Wins Matter!',
  'Never Strive, Always Settle!',
];
const PHRASE_IDX_KEY = 'airdefenders_phrase_idx';
let currentPhrase = '';

function pickEndPhrase() {
  let idx = parseInt(localStorage.getItem(PHRASE_IDX_KEY) || '0', 10);
  if (isNaN(idx) || idx < 0) idx = 0;
  currentPhrase = END_PHRASES[idx % END_PHRASES.length];
  localStorage.setItem(PHRASE_IDX_KEY, String((idx + 1) % END_PHRASES.length));
}

// --- TOP-FIVE CELEBRATION ---
let celebrationTimer = 0;          // frames remaining (120 = 2s at 60fps)
let celebrationRank = 0;           // 1-5; used in the flashing banner
const CELEBRATION_FRAMES = 120;
const confetti = [];               // {x,y,vx,vy,color,size,rot,rotV}
const CONFETTI_COLORS = ['#00ff88', '#ffcc00', '#ff4488', '#00aaff', '#ff8844', '#aa44ff'];

function spawnConfetti(count) {
  confetti.length = 0;
  for (let i = 0; i < count; i++) {
    confetti.push({
      x: Math.random() * GAME_W,
      y: -20 - Math.random() * 300,
      vx: (Math.random() - 0.5) * 4,
      vy: 1 + Math.random() * 3,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      size: 4 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.3,
    });
  }
}

function tickConfetti() {
  for (const p of confetti) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.rot += p.rotV;
    if (p.y > GAME_H + 20) { // recycle off-screen particles back to the top
      p.y = -20;
      p.x = Math.random() * GAME_W;
      p.vy = 1 + Math.random() * 3;
    }
  }
}

function drawConfetti() {
  for (const p of confetti) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    ctx.restore();
  }
}

function startCelebration(rank) {
  celebrationRank = rank;
  celebrationTimer = CELEBRATION_FRAMES;
  spawnConfetti(120);
  state = CELEBRATION;
}

function confirmName() {
  const name = nameInput.value.trim() || 'ANON';
  const myScore = score;
  saveScore(myScore, wave, name);
  scoreSaved = true;
  hideNameInput();
  // Determine rank against the currently cached top-10. If we beat at least
  // five existing scores' worth of room (i.e. rank 1-5), run the celebration
  // before falling into the normal game-over screen.
  const all = (serverScores.all && serverScores.all.length > 0) ? serverScores.all : loadLocalScores();
  const rank = all.filter(s => s.score > myScore).length + 1;
  if (rank <= 5) startCelebration(rank);
  // Pick the end-of-game phrase now so the game-over screen has it ready.
  pickEndPhrase();
}

nameInput.addEventListener('keydown', e => {
  e.stopPropagation(); // don't let game keys fire
  if (e.code === 'Enter')  {
    if (state === TITLE) closeNameEditorOnTitle(true);
    else confirmName();
  } else if (e.code === 'Escape') {
    if (state === TITLE) closeNameEditorOnTitle(false);
    else confirmName(); // GAME_OVER: Esc still confirms-with-current-text (legacy)
  }
});
nameInput.addEventListener('blur', () => {
  // Mobile soft-keyboard "done" collapses without firing a keydown — blur is
  // the signal that the user is finished typing. Treat as commit on the
  // TITLE screen so the entered name lands without an explicit Enter press.
  if (state === TITLE && nameInput.style.display !== 'none') closeNameEditorOnTitle(true);
});

function openNameEditorOnTitle() {
  enteringName = true;
  const r = canvas.getBoundingClientRect();
  const scale = r.width / GAME_W;
  nameInput.value = (localStorage.getItem(NAME_KEY) || '').toUpperCase().slice(0, 14);
  nameInput.style.display = 'block';
  nameInput.style.left = (r.left + r.width / 2 - 110) + 'px';
  nameInput.style.top  = (r.top + r.height * 0.66) + 'px';

  nameInput.select();
}
function closeNameEditorOnTitle(commit) {
  if (commit) {
    const raw = (nameInput.value || '').trim();
    if (raw) {
      const clean = raw.toUpperCase().replace(/[^A-Z0-9 _-]/g, '').slice(0, 14);
      if (clean) localStorage.setItem(NAME_KEY, clean);
    }
  }

  nameInput.blur();

}

function filterScores(period) {
  const key = PERIOD_API[period];
  const server = serverScores[key] || [];
  // Online path: trust the server result (already top-10 for the period).
  if (server.length || onlineMode) return server.slice(0, 10);
  // Offline fallback: client-side filter of the local mirror.
  const scores = loadLocalScores();
  const now = Date.now();
  const day = 86400000;
  let cutoff;
  switch (period) {
    case 0: cutoff = now - day; break;
    case 1: cutoff = now - 7 * day; break;
    case 2: cutoff = now - 30 * day; break;
    case 3: cutoff = new Date(new Date().getFullYear(), 0, 1).getTime(); break;
    default: cutoff = 0; break;
  }
  return scores.filter(s => s.date >= cutoff).sort((a, b) => b.score - a.score).slice(0, 10);
}

function drawLeaderboard(yStart, currentScore) {
  const scores = filterScores(leaderboardPeriod);
  const cx = canvas.width / 2;
  ctx.textAlign = 'center';
  // Period tabs
  ctx.font = '11px "Courier New", monospace';
  const tabSpacing = 80;
  const tabStartX = cx - (PERIOD_LABELS.length - 1) * tabSpacing / 2;
  for (let i = 0; i < PERIOD_LABELS.length; i++) {
    ctx.fillStyle = i === leaderboardPeriod ? '#00ff88' : '#004422';
    ctx.fillText(PERIOD_LABELS[i], tabStartX + i * tabSpacing, yStart);
  }
  lbTapZone = { x1: tabStartX - 40, x2: tabStartX + (PERIOD_LABELS.length - 1) * tabSpacing + 40, y1: yStart - 12, y2: yStart + 6 };
  ctx.fillStyle = '#005522';
  ctx.font = '10px "Courier New", monospace';
  ctx.fillText(isTouchDevice ? 'tap period to switch' : '[ ] change period', cx, yStart + 14);
  // Header
  ctx.fillStyle = '#00aa66';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText('\u2500\u2500 HIGH SCORES \u2500\u2500', cx, yStart + 32);
  if (!onlineMode) {
    ctx.fillStyle = '#aa6600';
    ctx.font = '10px "Courier New", monospace';
    ctx.fillText('OFFLINE \u2014 LOCAL CACHE', cx, yStart + 44);
  }
  // Score entries
  ctx.font = '12px "Courier New", monospace';
  if (scores.length === 0) {
    ctx.fillStyle = '#004422';
    ctx.fillText('No scores yet', cx, yStart + 52);
  } else {
    let highlighted = false;
    for (let i = 0; i < Math.min(scores.length, 5); i++) {
      const e = scores[i];
      const hl = currentScore !== undefined && !highlighted && e.score === currentScore;
      if (hl) highlighted = true;
      ctx.fillStyle = hl ? '#00ff88' : '#00aa66';
      const d = new Date(e.date);
      const dateStr = (d.getMonth() + 1) + '/' + d.getDate();
      const name = (e.name || 'ANON').padEnd(14).substring(0, 14);
      ctx.fillText((i + 1) + '. ' + name + ' ' + ('' + e.score).padStart(6) + '  W' + e.wave + '  ' + dateStr, cx, yStart + 52 + i * 16);
    }
  }
  ctx.textAlign = 'left';
}

// --- LAUNCHERS ---

// --- BUNKER RUN (starts one wave after dual launchers) ---
// Wave introduces a periodic TBM event: 10s warning, 5s to reach bunker.
// Player must commit to RUN while >5s remain. Failure = instant game over.
const BUNKER_RUN_WAVE = 5;
const BUNKER_WARNING_FRAMES = 600; // 10s at 60fps
const BUNKER_RUN_FRAMES = 300;     // 5s to traverse
const BUNKER_POST_FRAMES = 90;     // 1.5s impact/cutscene tail
const BUNKER_X = 60;               // ground-x of bunker door
const BUNKER_CHAR_START_X = GAME_W / 2;
let bunkerPhase = 'idle';      // 'idle' | 'active' | 'post'
let bunkerTimer = 0;           // active: warning countdown (frames remaining)
let bunkerRunTimer = 0;        // 0 until RUN pressed, then frames since commit
let bunkerOutcome = 'pending'; // 'pending' | 'safe' | 'hit'
let bunkerPostTimer = 0;
let bunkerSchedule = [];       // waveTimer frames at which to trigger events
let bunkerDone = 0;
const BTN_BUNKER_RUN = { x: GAME_W / 2 - 90, y: GAME_H / 2 - 40, w: 180, h: 70 };
const BTN_CAMEL = { x: GAME_W - 150, y: 100, w: 135, h: 40 };

// --- CAMEL RELIEF WAVE ---
// Wave 6 is a bonus/relief wave: player taps sky (or presses C) to release
// autonomous camels that walk the ground and spit at shaheds. A hit flips
// the shahed into retreat (flies off upward). No intercepts earned here.
const CAMEL_WAVE = 6;
const CAMEL_POOL_START = 12;
const CAMEL_SPIT_RANGE_X = 90;
const CAMEL_SPIT_RANGE_Y = 320;
const CAMEL_SPIT_COOLDOWN = 75;
let camelMode = false;
let camels = [];
let camelSpits = [];
let camelPool = 0;
let camelReleaseTimer = 0;

function makeCamel(fromLeft) {
  const x = fromLeft ? -20 : GAME_W + 20;
  return {
    x, vx: (fromLeft ? 1 : -1) * (0.8 + Math.random() * 0.5),
    bob: Math.random() * Math.PI * 2,
    spitCooldown: 30 + Math.floor(Math.random() * 30),
    age: 0
  };
}

function releaseCamel() {
  if (!camelMode || camelPool <= 0) return;
  camels.push(makeCamel(Math.random() < 0.5));
  camelPool--;
}

function updateCamels() {
  if (!camelMode) return;
  if (camelPool > 0) {
    camelReleaseTimer--;
    if (camelReleaseTimer <= 0) {
      releaseCamel();
      camelReleaseTimer = 150;
    }
  }
  const groundY = canvas.height - 50;
  for (const c of camels) {
    c.age++;
    c.bob += 0.25;
    let target = null;
    let bestDx = Infinity;
    for (const s of shaheds) {
      if (!s.alive || s.retreating) continue;
      const adx = Math.abs(s.x - c.x);
      if (adx < bestDx) { bestDx = adx; target = s; }
    }
    if (target) {
      const dx = target.x - c.x;
      if (Math.abs(dx) > 6) {
        const dir = Math.sign(dx);
        c.vx += dir * 0.08;
        c.vx = Math.max(-1.6, Math.min(1.6, c.vx));
      } else {
        c.vx *= 0.55;
      }
    }
    c.x += c.vx;
    if (c.x < 12) { c.x = 12; c.vx = Math.abs(c.vx); }
    if (c.x > canvas.width - 12) { c.x = canvas.width - 12; c.vx = -Math.abs(c.vx); }
    c.spitCooldown--;
    if (c.spitCooldown <= 0 && target
        && Math.abs(target.x - c.x) < CAMEL_SPIT_RANGE_X
        && (groundY - target.y) < CAMEL_SPIT_RANGE_Y) {
      const dx = target.x - c.x;
      const dy = target.y - (groundY - 14);
      const dist = Math.max(40, Math.hypot(dx, dy));
      const speed = 5.5;
      camelSpits.push({
        x: c.x + (c.vx >= 0 ? 14 : -14),
        y: groundY - 24,
        vx: (dx / dist) * speed,
        vy: (dy / dist) * speed,
        age: 0, alive: true
      });
      c.spitCooldown = CAMEL_SPIT_COOLDOWN;
    }
  }
  for (const p of camelSpits) {
    if (!p.alive) continue;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.age++;
    if (p.age > 180 || p.y < -30 || p.y > canvas.height || p.x < -20 || p.x > canvas.width + 20) {
      p.alive = false;
      continue;
    }
    for (const s of shaheds) {
      if (!s.alive || s.retreating) continue;
      if (Math.hypot(s.x - p.x, s.y - p.y) < 22) {
        s.retreating = true;
        s.retreatVx = (Math.random() - 0.5) * 1.5;
        s.retreatAccel = 0;
        s.outcome = 'retreated';
        p.alive = false;
        score += 50;
        break;
      }
    }
  }
  camelSpits = camelSpits.filter(p => p.alive);
}

function scheduleBunkerEvents() {
  bunkerSchedule = [];
  bunkerDone = 0;
  bunkerPhase = 'idle';
  bunkerOutcome = 'pending';
  bunkerRunTimer = 0;
  if (wave < BUNKER_RUN_WAVE) return;
  if (wave === CAMEL_WAVE) return;
  const count = Math.min(3, 1 + Math.floor((wave - BUNKER_RUN_WAVE) / 3));
  const spawnInterval = Math.max(40, 120 - wave * 10);
  const approxWaveFrames = (2 + wave * 2) * spawnInterval + 300;
  const fracs = count === 1 ? [0.5] : count === 2 ? [0.33, 0.72] : [0.22, 0.53, 0.82];
  for (const f of fracs) {
    const jitter = Math.floor((Math.random() - 0.5) * 120);
    bunkerSchedule.push(Math.max(120, Math.floor(approxWaveFrames * f) + jitter));
  }
}

function startBunkerRun() {
  if (bunkerPhase !== 'active') return;
  if (bunkerRunTimer > 0) return;
  bunkerRunTimer = 1;
}

function updateBunker() {
  if (bunkerPhase === 'idle') {
    if (bunkerDone < bunkerSchedule.length && waveTimer >= bunkerSchedule[bunkerDone]) {
      bunkerPhase = 'active';
      bunkerTimer = BUNKER_WARNING_FRAMES;
      bunkerRunTimer = 0;
      bunkerOutcome = 'pending';
    }
    return;
  }
  if (bunkerPhase === 'active') {
    bunkerTimer--;
    if (bunkerRunTimer > 0) bunkerRunTimer++;
    if (bunkerTimer <= 0) {
      bunkerOutcome = bunkerRunTimer >= BUNKER_RUN_FRAMES ? 'safe' : 'hit';
      bunkerPhase = 'post';
      bunkerPostTimer = BUNKER_POST_FRAMES;
    }
    return;
  }
  if (bunkerPhase === 'post') {
    bunkerPostTimer--;
    if (bunkerPostTimer <= 0) {
      if (bunkerOutcome === 'hit') {
        lives = 0;
        state = GAME_OVER;
        showNameInput();
        trajectories = {
          shaheds: shaheds.map(s => ({ path: s.path, outcome: s.outcome || 'impact' })),
          interceptors: interceptors.map(i => ({ path: i.path, outcome: i.outcome || 'miss' }))
        };
        bunkerPhase = 'idle';
        return;
      }
      bunkerPhase = 'idle';
      bunkerDone++;
      bunkerRunTimer = 0;
      bunkerOutcome = 'pending';
    }
  }
}

function bunkerLocksFire() {
  return (bunkerPhase === 'active' && bunkerRunTimer > 0) || bunkerPhase === 'post';
}

let keys = {};

document.addEventListener('keydown', e => {

  if (e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'Tab') e.preventDefault();

    else if (state === EMPLACEMENT) { startCombat(); spaceCooldown = 15; }
    else if (state === WAVE_END && waveEndTimer > 60) { startEmplacement(); spaceCooldown = 15; }
    else if (state === GAME_OVER) {
      // Return to TITLE (home) instead of auto-restarting the round.
      // resetGame() runs implicitly when startEmplacement() fires from the
      // next TITLE-state SPACE press.
      state = TITLE;
      spaceCooldown = 15;
      refreshServerScores(leaderboardPeriod, true);
    }
    else if (state === COMBAT) { fireFromLauncher(activeLauncher); }
  }
  if (state === COMBAT && e.code === 'Tab') {
    const L = launchers[activeLauncher];
    L.fireMode = (L.fireMode + 1) % 3;
    if (L.fireMode === 0) { L.arming = false; L.armTimer = 0; }
  }
  // Resupply with R key
  if (state === COMBAT && e.code === 'KeyR') triggerResupply(activeLauncher);
  // Switch active launcher with 1/2 keys
  // Q toggles between launchers (wave 4+ only). Replaces the original 1/2
  // keybinding so the off-hand can stay on the WASD cluster — Q sits one row
  // above A so no hand-movement is needed mid-combat.
  if (state === COMBAT && e.code === 'KeyQ' && launchers.length > 1) {
    activeLauncher = (activeLauncher + 1) % launchers.length;
  }
  // Bunker RUN
  if (state === COMBAT && e.code === 'KeyB') startBunkerRun();
  // Camel relief wave — release a camel
  if (state === COMBAT && camelMode && e.code === 'KeyC') releaseCamel();
  // Leaderboard period switching
  if ((state === TITLE || state === GAME_OVER) && e.code === 'BracketLeft') {
    leaderboardPeriod = Math.max(0, leaderboardPeriod - 1);
    refreshServerScores(leaderboardPeriod, true);
  }
  if ((state === TITLE || state === GAME_OVER) && e.code === 'BracketRight') {
    leaderboardPeriod = Math.min(4, leaderboardPeriod + 1);

  }
  // Dismiss freeze frame
  if ((state === WAVE_END || state === GAME_OVER) && e.code === 'Escape') selectedSnapshot = null;
});

function updateMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
  mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
}

function handleMouseDown() {
  if (state === TITLE) {
    if (inBtn({ x: mouse.x, y: mouse.y }, BTN_EDIT_NAME)) { openNameEditorOnTitle(); return; }
    if (inBtn({ x: mouse.x, y: mouse.y }, BTN_MP_LINK)) { window.location.href = '/mp'; return; }
    if (ME.demo_admin && inBtn({ x: mouse.x, y: mouse.y }, BTN_DEMO)) { openFabricDemo(); return; }
    return;
  }
  if (state === EMPLACEMENT) {
    for (let i = radars.length - 1; i >= 0; i--) {
      const r = radars[i];
      const d = Math.hypot(mouse.x - r.x, mouse.y - r.y);
      if (d < 20) { draggedRadar = i; return; }
    }
  }
  // Click on launcher bar to fire (desktop)
  if (state === COMBAT && mouse.y > GAME_H - 55) {
    const li = getLauncherAtX(mouse.x);
    fireFromLauncher(li);
  }
  // Kill point click in trajectory review
  if ((state === WAVE_END || state === GAME_OVER) && killSnapshots.length > 0) {
    if (selectedSnapshot !== null) {
      selectedSnapshot = null;
      return;
    }
    for (let ki = 0; ki < killSnapshots.length; ki++) {
      const ks = killSnapshots[ki];
      if (Math.hypot(mouse.x - ks.x, mouse.y - ks.y) < 18) {

      }
    }
  }
}

function handleMouseMove() {
  if (state !== EMPLACEMENT || draggedRadar < 0) return;
  radars[draggedRadar].x = Math.max(40, Math.min(canvas.width - 40, mouse.x));
  radars[draggedRadar].y = Math.max(100, Math.min(canvas.height - 120, mouse.y));
}

// --- BLAST WAVE EFFECT ---

function drawBlastWaves() {
  for (let i = blastWaves.length - 1; i >= 0; i--) {
    const bw = blastWaves[i];
    bw.radius += (bw.maxRadius - bw.radius) * 0.15;
    bw.life -= 0.03;
    if (bw.life <= 0) { blastWaves.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(bw.x, bw.y, bw.radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 255, 120, ' + (bw.life * 0.5) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(0, 255, 120, ' + (bw.life * 0.05) + ')';
    ctx.fill();
  }
}
