# Base-image refresh (goatcore ADR 1220). Each role file under ops/base-images/
# pins one base by digest; Dependabot opens a PR when the pinned tag has a newer
# build. The base-images check then fails until
# `python3 ops/base-images/base-images.py sync` rewrites the Dockerfile defaults.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /ops/base-images/go-build
      - /ops/base-images/runtime-static
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
